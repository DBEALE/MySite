<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MySite</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  nav { background: #222; padding: 12px 20px; }
  nav a { color: #fff; text-decoration: none; font-weight: bold; cursor: pointer; }
  main { padding: 20px; }
  #build-panel { display: none; max-width: 600px; }
  #build-panel textarea { width: 100%; height: 120px; box-sizing: border-box; }
  #status { margin-top: 8px; }
</style>
</head>
<body>
<nav><a id="build-link">Build</a></nav>
<main>
  <section id="build-panel">
    <h2>Build</h2>
    <p>Describe how to change or enhance this site.</p>
    <textarea id="prompt" placeholder="e.g. Add a header with a welcome message"></textarea>
    <br><button id="submit">Submit</button>
    <div id="status"></div>
  </section>
</main>
<script>
  const panel = document.getElementById('build-panel');
  document.getElementById('build-link').onclick = () => {
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  };
  document.getElementById('submit').onclick = async () => {
    const status = document.getElementById('status');
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) return;
    status.textContent = 'Building...';
    try {
      const r = await fetch('/api/build', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Build failed');
      status.textContent = 'Done! Reloading...';
      setTimeout(() => location.reload(), 800);
    } catch (e) {
      status.textContent = 'Error: ' + e.message;
    }
  };
</script>
</body>
</html>
